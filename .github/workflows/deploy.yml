name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; si llega otro push, se cancela el que estaba en curso.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Sincroniza dist/ con el servidor por FTPS. Guarda un fichero de estado
      # (.ftp-deploy-sync-state.json) en el servidor y en cada push solo sube
      # lo que cambió y borra lo que ya no existe en dist/.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # La cuenta FTP de Hostinger ya entra directamente en public_html.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
